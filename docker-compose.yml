# Local development PostgreSQL. `pnpm db:up` / `pnpm db:down`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tripsalesagent
      POSTGRES_PASSWORD: tripsalesagent
      POSTGRES_DB: tripsalesagent
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tripsalesagent']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
